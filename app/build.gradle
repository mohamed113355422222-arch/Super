plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Version can be overridden by CI via: -PversionCode=123 -PversionName=1.2.3
def appVersionCode = project.findProperty("versionCode")?.toInteger() ?: 61
def appVersionName = project.findProperty("versionName") ?: "1.9.36"

android {
    namespace 'com.supershade'
    compileSdk 36

    defaultConfig {
        applicationId "com.supershade"
        minSdk 29
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath && new File(ksPath).exists()) {
                storeFile file(ksPath)
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
                storePassword System.getenv("STORE_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath && new File(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debugConfig
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        compose true
        aidl true
        buildConfig true
    }

    lint {
        // Known crash: AGP 8.7.0 lint + Kotlin 2.x Analysis API incompatibility.
        disable 'NullSafeMutableLiveData'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    bundle {
        language { enableSplit = false }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2026.02.00')
    implementation composeBom
    androidTestImplementation composeBom

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Material 3
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'

    // Activity + Lifecycle Compose
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // Shizuku
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Koin
    implementation 'io.insert-koin:koin-android:3.5.3'
    implementation 'io.insert-koin:koin-androidx-compose:3.5.3'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Navigation Compose
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // Serialization (used by UpdateChecker for GitHub JSON)
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // Palette (album art dominant color extraction)
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // HiddenApiBypass
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}

afterEvaluate {
    tasks.matching { it.name == 'assembleDebug' }.configureEach {
        doLast {
            def debugApk = layout.buildDirectory.file("outputs/apk/debug/app-debug.apk").get().asFile
            if (!debugApk.exists() || debugApk.length() <= 0L) {
                throw new GradleException("Built APK missing or empty: ${debugApk.absolutePath}")
            }

            // Verify APK ZIP container integrity before exporting
            def zip = new java.util.zip.ZipFile(debugApk)
            try {
                ["AndroidManifest.xml", "resources.arsc"].each { reqEntry ->
                    if (zip.getEntry(reqEntry) == null) {
                        throw new GradleException("Built APK missing required entry '${reqEntry}': ${debugApk.absolutePath}")
                    }
                }
            } finally {
                zip.close()
            }

            def sha256 = { File f ->
                def md = java.security.MessageDigest.getInstance("SHA-256")
                f.withInputStream { is ->
                    byte[] buf = new byte[8192]
                    int read
                    while ((read = is.read(buf)) != -1) {
                        md.update(buf, 0, read)
                    }
                }
                md.digest().collect { String.format("%02x", it) }.join("")
            }

            def sourceHash = sha256(debugApk)
            def releaseDir = new File(rootDir, "SuperShade-Release")
            if (!releaseDir.exists()) releaseDir.mkdirs()

            def targets = [
                new File(releaseDir, "SuperShade-iOS-StatusBar.apk"),
                new File(rootDir, "SuperShade-iOS-StatusBar.apk"),
                new File(rootDir, "SuperShade-iOS.apk"),
                new File(rootDir, "app9292.apk"),
            ]

            targets.each { dest ->
                def tmp = new File(dest.parentFile, "${dest.name}.tmp")
                java.nio.file.Files.copy(
                    debugApk.toPath(),
                    tmp.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                java.nio.file.Files.move(
                    tmp.toPath(),
                    dest.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                if (!dest.exists() || dest.length() != debugApk.length() || sha256(dest) != sourceHash) {
                    throw new GradleException("Exported APK checksum/size mismatch: ${dest.absolutePath}")
                }
            }

            def staleOldApk = new File(rootDir, "SuperShade-debug.apk")
            if (staleOldApk.exists()) {
                staleOldApk.delete()
            }

            println("[SuperShade APK Export] Source : ${debugApk.absolutePath} (${debugApk.length()} bytes, SHA-256=${sourceHash})")
            println("[SuperShade APK Export] Release: ${targets[0].absolutePath} (${targets[0].length()} bytes, verified identical)")
            println("[SuperShade APK Export] Root   : ${targets[1].absolutePath} (${targets[1].length()} bytes, verified identical)")
            println("[SuperShade APK Export] Root2  : ${targets[2].absolutePath} (${targets[2].length()} bytes, verified identical)")

            // Run aapt2 and apksigner verification if build-tools are present in ANDROID_SDK_ROOT
            def sdkDir = android.sdkDirectory
            def buildToolsRoot = sdkDir != null ? new File(sdkDir, "build-tools") : null
            if (buildToolsRoot != null && buildToolsRoot.exists()) {
                def versions = buildToolsRoot.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> a.name <=> b.name }
                def latestBt = versions ? versions.last() : null
                if (latestBt != null) {
                    def aapt2 = new File(latestBt, "aapt2")
                    if (aapt2.exists() && aapt2.canExecute()) {
                        def proc = new ProcessBuilder(aapt2.absolutePath, "dump", "badging", targets[0].absolutePath)
                            .redirectErrorStream(true).start()
                        def out = proc.inputStream.text.readLines().take(6).join("\n")
                        def rc = proc.waitFor()
                        if (rc != 0) throw new GradleException("aapt2 dump badging failed (rc=$rc):\n$out")
                        println("[SuperShade aapt2]\n$out")
                    }
                    def apksigner = new File(latestBt, "apksigner")
                    if (apksigner.exists() && apksigner.canExecute()) {
                        def proc = new ProcessBuilder(apksigner.absolutePath, "verify", "--print-certs", targets[0].absolutePath)
                            .redirectErrorStream(true).start()
                        def out = proc.inputStream.text.trim()
                        def rc = proc.waitFor()
                        if (rc != 0) throw new GradleException("apksigner verify failed (rc=$rc):\n$out")
                        println("[SuperShade apksigner]\n$out")
                    }
                }
            }
        }
    }

    tasks.register("locateAndExportApk") {
        group = "verification"
        description = "Inspects all APK output directories, verifies the most recent APK, and copies it atomically to /SuperShade-iOS.apk"
        doLast {
            def sha256 = { File f ->
                def md = java.security.MessageDigest.getInstance("SHA-256")
                f.withInputStream { is ->
                    byte[] buf = new byte[8192]
                    int read
                    while ((read = is.read(buf)) != -1) {
                        md.update(buf, 0, read)
                    }
                }
                md.digest().collect { String.format("%02x", it) }.join("")
            }

            def dirsToCheck = [
                layout.buildDirectory.dir("outputs/apk/debug").get().asFile,
                layout.buildDirectory.dir("outputs/apk/release").get().asFile,
                new File(rootDir, ".build-outputs"),
                new File(rootDir, "SuperShade-Release"),
            ]
            dirsToCheck.each { d ->
                println("CHECK_DIR=${d.absolutePath} exists=${d.exists()}")
                if (d.exists()) {
                    d.listFiles()?.sort { a, b -> a.name <=> b.name }?.each { f ->
                        println("  FILE=${f.name} bytes=${f.length()} mtime=${new Date(f.lastModified())}")
                    }
                }
            }

            def gradleDebugApk = layout.buildDirectory.file("outputs/apk/debug/app-debug.apk").get().asFile
            def platformApk = new File(rootDir, ".build-outputs/app-debug.apk")
            def sourceApk = gradleDebugApk.exists() && gradleDebugApk.length() > 0L ? gradleDebugApk :
                (platformApk.exists() && platformApk.length() > 0L ? platformApk : null)

            if (sourceApk == null) {
                throw new GradleException("No valid generated APK found in app/build/outputs/apk/debug or .build-outputs")
            }

            def zip = new java.util.zip.ZipFile(sourceApk)
            def dexEntries = []
            boolean hasStatusBarConfigDex = false
            boolean hasSettingsSectionDex = false
            try {
                if (zip.getEntry("AndroidManifest.xml") == null || zip.getEntry("resources.arsc") == null) {
                    throw new GradleException("Missing manifest or resources in ${sourceApk.absolutePath}")
                }
                zip.entries().each { entry ->
                    if (entry.name.endsWith(".dex")) {
                        dexEntries << "${entry.name}:${entry.size}"
                        def bytes = zip.getInputStream(entry).bytes
                        def text = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                        if (text.contains("StatusBarConfig")) hasStatusBarConfigDex = true
                        if (text.contains("CustomStatusBarSettingsSection")) hasSettingsSectionDex = true
                    }
                }
            } finally {
                zip.close()
            }

            def srcHash = sha256(sourceApk)
            println("SOURCE_APK=${sourceApk.absolutePath} bytes=${sourceApk.length()} sha256=${srcHash}")
            println("DEX_ENTRIES=${dexEntries.join(', ')}")
            println("CONTAINS_StatusBarConfig=${hasStatusBarConfigDex} CONTAINS_CustomStatusBarSettingsSection=${hasSettingsSectionDex}")

            def destApks = [
                new File(rootDir, "SuperShade-iOS.apk"),
                new File(rootDir, "app9292.apk"),
            ]
            destApks.each { destApk ->
                def tmpApk = new File(rootDir, "${destApk.name}.tmp")
                java.nio.file.Files.copy(sourceApk.toPath(), tmpApk.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                java.nio.file.Files.move(tmpApk.toPath(), destApk.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                def destHash = sha256(destApk)
                if (!destApk.exists() || destApk.length() != sourceApk.length() || destHash != srcHash) {
                    throw new GradleException("Copy verification failed for ${destApk.absolutePath}")
                }
                println("DEST_APK=${destApk.absolutePath} bytes=${destApk.length()} sha256=${destHash} identical=${destHash == srcHash}")
            }

            def sdkDir = android.sdkDirectory
            def buildToolsRoot = sdkDir != null ? new File(sdkDir, "build-tools") : null
            def versions = buildToolsRoot != null && buildToolsRoot.exists() ?
                buildToolsRoot.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> a.name <=> b.name } : []
            def latestBt = versions ? versions.last() : null
            if (latestBt != null) {
                def aapt2 = new File(latestBt, "aapt2")
                if (aapt2.exists() && aapt2.canExecute()) {
                    def proc = new ProcessBuilder(aapt2.absolutePath, "dump", "badging", destApks[0].absolutePath)
                        .redirectErrorStream(true).start()
                    def out = proc.inputStream.text.readLines().take(6).join("\n")
                    def rc = proc.waitFor()
                    if (rc != 0) throw new GradleException("aapt2 failed: $out")
                    println("AAPT2_BADGING:\n$out")
                }
                def apksigner = new File(latestBt, "apksigner")
                if (apksigner.exists() && apksigner.canExecute()) {
                    def proc = new ProcessBuilder(apksigner.absolutePath, "verify", "--print-certs", destApks[0].absolutePath)
                        .redirectErrorStream(true).start()
                    def out = proc.inputStream.text.trim()
                    def rc = proc.waitFor()
                    if (rc != 0) throw new GradleException("apksigner failed: $out")
                    println("APKSIGNER_CERTS:\n$out")
                }
            }
        }
    }

    tasks.register("verifyExportedApk") {
        group = "verification"
        description = "Verifies exported SuperShade-iOS-StatusBar.apk files against app-debug.apk"
        doLast {
            def debugApk = layout.buildDirectory.file("outputs/apk/debug/app-debug.apk").get().asFile
            def releaseApk = new File(rootDir, "SuperShade-Release/SuperShade-iOS-StatusBar.apk")
            def rootApk = new File(rootDir, "SuperShade-iOS-StatusBar.apk")

            def sha256 = { File f ->
                def md = java.security.MessageDigest.getInstance("SHA-256")
                f.withInputStream { is ->
                    byte[] buf = new byte[8192]
                    int read
                    while ((read = is.read(buf)) != -1) {
                        md.update(buf, 0, read)
                    }
                }
                md.digest().collect { String.format("%02x", it) }.join("")
            }

            [debugApk, releaseApk, rootApk].each { f ->
                if (!f.exists() || f.length() <= 0L) {
                    throw new GradleException("Missing or empty APK: ${f.absolutePath}")
                }
                def zip = new java.util.zip.ZipFile(f)
                try {
                    if (zip.getEntry("AndroidManifest.xml") == null || zip.getEntry("resources.arsc") == null) {
                        throw new GradleException("Corrupt APK ZIP structure: ${f.absolutePath}")
                    }
                } finally {
                    zip.close()
                }
            }

            def srcHash = sha256(debugApk)
            def relHash = sha256(releaseApk)
            def rootHash = sha256(rootApk)
            if (srcHash != relHash || srcHash != rootHash) {
                throw new GradleException("APK hash mismatch: debug=$srcHash release=$relHash root=$rootHash")
            }

            println("APK_VERIFY_SOURCE=${debugApk.absolutePath} bytes=${debugApk.length()} sha256=${srcHash}")
            println("APK_VERIFY_RELEASE=${releaseApk.absolutePath} bytes=${releaseApk.length()} sha256=${relHash}")
            println("APK_VERIFY_ROOT=${rootApk.absolutePath} bytes=${rootApk.length()} sha256=${rootHash}")

            def sdkDir = android.sdkDirectory
            def buildToolsRoot = sdkDir != null ? new File(sdkDir, "build-tools") : null
            def versions = buildToolsRoot != null && buildToolsRoot.exists() ?
                buildToolsRoot.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> a.name <=> b.name } : []
            def latestBt = versions ? versions.last() : null
            if (latestBt != null) {
                def aapt2 = new File(latestBt, "aapt2")
                if (aapt2.exists() && aapt2.canExecute()) {
                    def proc = new ProcessBuilder(aapt2.absolutePath, "dump", "badging", releaseApk.absolutePath)
                        .redirectErrorStream(true).start()
                    def out = proc.inputStream.text.readLines().take(6).join("\n")
                    def rc = proc.waitFor()
                    if (rc != 0) throw new GradleException("aapt2 failed: $out")
                    println("AAPT2_BADGING:\n$out")
                }
                def apksigner = new File(latestBt, "apksigner")
                if (apksigner.exists() && apksigner.canExecute()) {
                    def proc = new ProcessBuilder(apksigner.absolutePath, "verify", "--print-certs", releaseApk.absolutePath)
                        .redirectErrorStream(true).start()
                    def out = proc.inputStream.text.trim()
                    def rc = proc.waitFor()
                    if (rc != 0) throw new GradleException("apksigner failed: $out")
                    println("APKSIGNER_CERTS:\n$out")
                }
            }
        }
    }
}

name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SuperShade-iOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure debug keystore
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "debug.keystore.base64 missing or empty; generating debug.keystore with keytool..."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Ensure Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify generated APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          if ! cmp -s "$APK_PATH" SuperShade-iOS.apk; then
            cp -f "$APK_PATH" SuperShade-iOS.apk
          fi
          ls -lh "$APK_PATH" SuperShade-iOS.apk
          sha256sum "$APK_PATH" SuperShade-iOS.apk

      - name: Upload SuperShade-iOS APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperShade-iOS-apk-${{ github.run_number }}
          path: SuperShade-iOS.apk
          retention-days: 14
          if-no-files-found: error
